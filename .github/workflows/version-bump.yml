name: version-bump

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require a package.json version change
        run: |
          current=$(node -p "require('./package.json').version")
          if git cat-file -e HEAD^:package.json 2>/dev/null; then
            previous=$(git show HEAD^:package.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")
            echo "previous=$previous current=$current"
            if [ "$current" = "$previous" ]; then
              echo "::error::Bump package.json on every push. Use a patch for fixes/docs, a minor for features, and call out breaking changes."
              exit 1
            fi
          else
            echo "root commit; no previous package.json"
          fi
